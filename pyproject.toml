[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "distro-event-tracker"
version = "0.1.0"
description = "Database-less Discord event and dibs tracker"
requires-python = ">=3.10"
dependencies = [
    "discord.py==2.6.4",
    "python-dotenv==1.2.1",
    "pytz==2025.2",
    "pynacl==1.5.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "import-linter>=2.1",
    "mypy>=1.15",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
skip-string-normalization = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.mypy]
python_version = "3.10"
files = [
    "src/distro_event_tracker/config.py",
    "src/distro_event_tracker/events/models.py",
    "src/distro_event_tracker/events/scoring.py",
    "src/distro_event_tracker/events/service.py",
    "src/distro_event_tracker/dibs/models.py",
]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["distro_event_tracker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
