apiVersion: apps/v1
kind: Deployment
metadata:
  name: distro-event-tracker-distro
  labels:
    app.kubernetes.io/name: distro-event-tracker
    app.kubernetes.io/instance: distro
  annotations:
    distro-event-tracker/revision: RELEASE_SHA
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: distro-event-tracker
      app.kubernetes.io/instance: distro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distro-event-tracker
        app.kubernetes.io/instance: distro
      annotations:
        distro-event-tracker/revision: RELEASE_SHA
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: localhost/distro-event-tracker:RELEASE_TAG
          imagePullPolicy: Never
          env:
            - name: ENV_FILE
              value: /dev/null
            - name: LOG_FILE
              value: ""
            - name: HEALTH_PORT
              value: "8080"
            - name: REMINDER_OPT_OUT_FILE
              value: /data/reminders_opt_out.txt
          envFrom:
            - secretRef:
                name: distro-event-tracker-distro
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: distro-event-tracker-distro-data
        - name: tmp
          emptyDir: {}
---
