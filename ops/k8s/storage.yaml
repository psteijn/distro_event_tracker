apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: distro-event-tracker-distro-data
  labels:
    app.kubernetes.io/name: distro-event-tracker
    app.kubernetes.io/instance: distro
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: distro-event-tracker-ocean-data
  labels:
    app.kubernetes.io/name: distro-event-tracker
    app.kubernetes.io/instance: ocean
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 64Mi
